# iou-agent custom NemoClaw policy preset.
#
# Layered on top of the default openclaw-sandbox policy. The default policy
# already permits POST /v1/chat/completions to integrate.api.nvidia.com — this
# preset *tightens* the surface to exactly what iou-agent needs:
#
#   * Only chat completions (no embeddings, no models list endpoint).
#   * No outbound HTTP to anywhere except NVIDIA inference and the managed
#     inference gateway. Everything else is denied by virtue of not being
#     listed (deny-by-default).
#   * Read-only filesystem outside the agent's scratch directory.
#
# Apply with:
#   nemoclaw policy apply --preset ./nemoclaw/iou-agent-policy.yaml --sandbox iou-agent

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /sandbox/.openclaw
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  iou_inference:
    name: iou_inference
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          # Only the chat completion endpoint — nothing else.
          - allow: { method: POST, path: "/v1/chat/completions" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }

  managed_inference:
    name: managed_inference
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
