# iou-agent custom NemoClaw preset: nvidia-inference
#
# Tightens NVIDIA inference egress to exactly what iou-agent needs:
#   * POST /v1/chat/completions to integrate.api.nvidia.com (Nemotron)
#   * POST /v1/chat/completions to the managed inference gateway
#   * Everything else (embeddings, /v1/models, other hosts) is denied by
#     virtue of not being listed (deny-by-default).
#
# Apply with (NemoClaw v0.0.50+):
#   nemoclaw iou-agent policy-add --from-file ./nemoclaw/iou-agent-policy.yaml --yes
#
# Or to apply this preset together with line-bot.yaml in one shot:
#   nemoclaw iou-agent policy-add --from-dir ./nemoclaw/presets --yes
#   nemoclaw iou-agent policy-add --from-file ./nemoclaw/iou-agent-policy.yaml --yes
#
# Note: The original draft of this file also declared filesystem_policy /
# landlock / process blocks for a custom *base* policy. NemoClaw v0.0.50's
# `policy-add` only applies network-policy presets; filesystem and process
# constraints are set by the base sandbox at onboard time. See
# docs/nemoclaw.md for the full intended security model.

preset:
  name: nvidia-inference
  description: "NVIDIA Nemotron inference (integrate.api.nvidia.com + managed gateway) restricted to POST /v1/chat/completions, originating only from node/openclaw binaries."

network_policies:
  iou_inference:
    name: iou_inference
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          # Only the chat completion endpoint — nothing else.
          - allow: { method: POST, path: "/v1/chat/completions" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }

  managed_inference:
    name: managed_inference
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
